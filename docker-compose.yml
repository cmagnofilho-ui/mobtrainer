version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: mobtrainer-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MOBTRAINER_DB_PATH: /data/mobtrainer.sqlite
      DEFAULT_CURRENCY: USD
      USD_TO_BRL: 5.6
    volumes:
      - mobtrainer_data:/data

volumes:
  mobtrainer_data:
