services:
  - type: web
    name: mobtrainer-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MOBTRAINER_DB_PATH
        value: ./data/mobtrainer.sqlite
      - key: DEFAULT_CURRENCY
        value: USD
      - key: USD_TO_BRL
        value: 5.6
      - key: APP_NAME
        value: MobTrainer
      - key: APP_BASE_URL
        value: https://mobtrainer.onrender.com
      - key: TOKEN_SECRET
        generateValue: true
